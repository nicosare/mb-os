<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>VK Camera</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
    color: #fff;
  }

  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: #000;
  }

  /* Верхняя панель */
  .top-bar {
    padding: calc(env(safe-area-inset-top) + 12px) 20px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
    background: #000;
  }

  .icon-btn {
    background: rgba(255, 255, 255, 0.15);
    border: none;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    color: #fff;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .room-badge {
    background: rgba(255, 255, 255, 0.12);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  /* Видоискатель камеры (Пропорции 3:4) */
  .viewport-container {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    overflow: hidden;
  }

  .viewfinder {
    width: 100%;
    max-width: 100vw;
    aspect-ratio: 3 / 4;
    position: relative;
    overflow: hidden;
    background: #050505;
  }

  #camera, #photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  #photo { display: none; }

  /* Сетка и прицел фокуса */
  .camera-grid {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
  }

  .grid-cell {
    border: 0.5px solid rgba(255, 255, 255, 0.18);
  }

  .focus-marker {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 64px;
    height: 64px;
    border: 1.5px solid #ffcc00;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .focus-marker::after {
    content: "+";
    color: rgba(255, 255, 255, 0.7);
    font-size: 20px;
    font-weight: 300;
  }

  /* Нижняя панель и карусель */
  .bottom-bar {
    background: #000;
    padding: 12px 16px calc(env(safe-area-inset-bottom) + 20px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  /* Карусель номеров */
  .carousel-wrap {
    width: 100%;
    max-width: 400px;
    position: relative;
  }

  .carousel {
    height: 44px;
    display: flex;
    align-items: center;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    padding: 0 calc(50% - 28px);
  }
  .carousel::-webkit-scrollbar { display: none; }

  .num-item {
    flex: 0 0 56px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    scroll-snap-align: center;
    font-size: 16px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.4);
    transition: color 0.15s, transform 0.15s;
    cursor: pointer;
  }

  .num-item.active {
    color: #ffcc00;
    font-size: 20px;
    font-weight: 700;
    transform: scale(1.1);
  }

  /* Кнопки затвора */
  .shutter-row {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
  }

  .btn-side {
    background: transparent;
    border: none;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    min-width: 80px;
  }

  .btn-side.danger { color: #ff4e4e; }

  #captureBtn {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: transparent;
    border: 4px solid #ffffff;
    padding: 3px;
    cursor: pointer;
  }
  #captureBtn:active { transform: scale(0.93); }
  #captureBtn span {
    display: block;
    width: 100%;
    height: 100%;
    background: #ffffff;
    border-radius: 50%;
  }

  .btn-send {
    background: #2688eb;
    color: #fff;
    border: none;
    padding: 12px 24px;
    border-radius: 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="app">
  <!-- Верхняя панель -->
  <div class="top-bar">
    <button class="icon-btn" id="btnFlash">⚡</button>
    <div class="room-badge" id="roomBadge">№ 01</div>
    <div style="width:38px;"></div>
  </div>

  <!-- Видоискатель камеры -->
  <div class="viewport-container">
    <div class="viewfinder">
      <video id="camera" autoplay playsinline muted></video>
      <img id="photo" alt="Снимок">
      
      <!-- Сетка и фокус -->
      <div class="camera-grid" id="gridOverlay">
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
      </div>
      <div class="focus-marker" id="focusMarker"></div>
    </div>
  </div>

  <!-- Нижняя панель управления -->
  <div class="bottom-bar">
    <!-- Карусель номеров -->
    <div class="carousel-wrap" id="carouselWrap">
      <div class="carousel" id="carousel"></div>
    </div>

    <!-- Кнопки съемки -->
    <div class="shutter-row" id="cameraActions">
      <button class="btn-side danger" id="btnEmpty">Опустошён</button>
      <button id="captureBtn" aria-label="Сделать фото"><span></span></button>
      <div style="min-width:80px;"></div>
    </div>

    <!-- Кнопки превью -->
    <div class="shutter-row hidden" id="previewActions">
      <button class="btn-side" id="btnRetake">✕ Переснять</button>
      <button class="btn-send" id="btnSend">Отправить 🚀</button>
    </div>
  </div>
</div>

<script type="module">
import bridge from 'https://cdn.jsdelivr.net/npm/@vkontakte/vk-bridge@3.0.2/+esm';

const video = document.getElementById('camera');
const photo = document.getElementById('photo');
const canvas = document.createElement('canvas');
const carousel = document.getElementById('carousel');
const captureBtn = document.getElementById('captureBtn');
const btnRetake = document.getElementById('btnRetake');
const btnSend = document.getElementById('btnSend');
const btnEmpty = document.getElementById('btnEmpty');
const btnFlash = document.getElementById('btnFlash');
const cameraActions = document.getElementById('cameraActions');
const previewActions = document.getElementById('previewActions');
const carouselWrap = document.getElementById('carouselWrap');
const gridOverlay = document.getElementById('gridOverlay');
const focusMarker = document.getElementById('focusMarker');
const roomBadge = document.getElementById('roomBadge');

let stream = null;
let selectedNumber = 1;
let snapTimer = null;
let flashlightAvailable = false;
let flashEnabled = true;

// 1. Инициализация VK Bridge
async function initVK() {
  try { await bridge.send('VKWebAppInit'); } catch(e){}
}

// 2. Тактильный отклик
async function triggerHaptic() {
  try {
    if (bridge.supports('VKWebAppTapticSelectionChanged')) {
      await bridge.send('VKWebAppTapticSelectionChanged');
      return;
    }
  } catch(e){}
  if (navigator.vibrate) navigator.vibrate(10);
}

// 3. Работа со вспышкой
async function checkFlashlight() {
  try {
    if (bridge.supports('VKWebAppFlashGetInfo')) {
      const data = await bridge.send('VKWebAppFlashGetInfo');
      flashlightAvailable = !!data?.is_available;
    }
  } catch(e) { flashlightAvailable = false; }
}

async function setFlashlight(level) {
  if (!flashlightAvailable || !flashEnabled) return;
  try { await bridge.send('VKWebAppFlashSetLevel', { level }); } catch(e){}
}

// 4. Мгновенный старт камеры при открытии
async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    await checkFlashlight();
  } catch(e) {
    console.error('Ошибка доступа к камере:', e);
  }
}

// 5. Карусель номеров
function buildCarousel() {
  const frag = document.createDocumentFragment();
  for (let i = 1; i <= 100; i++) {
    const el = document.createElement('div');
    el.className = 'num-item';
    el.dataset.number = i;
    el.textContent = String(i).padStart(2, '0');
    frag.appendChild(el);
  }
  carousel.appendChild(frag);
  requestAnimationFrame(() => selectNumber(1, false));
}

function selectNumber(n, vibrate = true) {
  selectedNumber = Math.max(1, Math.min(100, n));
  const el = carousel.querySelector(`[data-number="${selectedNumber}"]`);
  if (!el) return;
  
  el.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  carousel.querySelectorAll('.num-item.active').forEach(x => x.classList.remove('active'));
  el.classList.add('active');
  
  roomBadge.textContent = `№ ${String(selectedNumber).padStart(2, '0')}`;
  if (vibrate) triggerHaptic();
}

function updateNumberFromScroll() {
  const items = [...carousel.querySelectorAll('.num-item')];
  const center = carousel.getBoundingClientRect().left + carousel.clientWidth / 2;
  let closest = null;
  let minDistance = Infinity;

  for (const el of items) {
    const rect = el.getBoundingClientRect();
    const distance = Math.abs((rect.left + rect.width / 2) - center);
    if (distance < minDistance) {
      minDistance = distance;
      closest = el;
    }
  }

  if (closest) {
    const num = Number(closest.dataset.number);
    if (num !== selectedNumber) {
      selectedNumber = num;
      items.forEach(x => x.classList.toggle('active', x === closest));
      roomBadge.textContent = `№ ${String(selectedNumber).padStart(2, '0')}`;
      triggerHaptic();
    }
  }
}

carousel.addEventListener('scroll', () => {
  updateNumberFromScroll();
  clearTimeout(snapTimer);
  snapTimer = setTimeout(updateNumberFromScroll, 100);
}, { passive: true });

carousel.addEventListener('click', (e) => {
  const item = e.target.closest('.num-item');
  if (item) selectNumber(Number(item.dataset.number));
});

// 6. Съемка с экспопаузой для вспышки
async function takePhoto() {
  if (!video.videoWidth) return;

  // Включаем вспышку
  await setFlashlight(1);

  // ЗАДЕРЖКА: Даем 400мс сенсору камеры подстроить экспозицию под яркость фонарика
  await new Promise(resolve => setTimeout(resolve, 400));

  const w = video.videoWidth;
  const h = video.videoHeight;
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');

  ctx.drawImage(video, 0, 0, w, h);

  // Выключаем вспышку после снимка
  await setFlashlight(0);
  await triggerHaptic();

  photo.src = canvas.toDataURL('image/jpeg', 0.92);
  photo.style.display = 'block';
  video.style.display = 'none';

  gridOverlay.classList.add('hidden');
  focusMarker.classList.add('hidden');
  cameraActions.classList.add('hidden');
  previewActions.classList.remove('hidden');
  carouselWrap.style.opacity = '0.3';
  carouselWrap.style.pointerEvents = 'none';
}

function resetPhoto() {
  photo.style.display = 'none';
  video.style.display = 'block';

  gridOverlay.classList.remove('hidden');
  focusMarker.classList.remove('hidden');
  previewActions.classList.add('hidden');
  cameraActions.classList.remove('hidden');
  carouselWrap.style.opacity = '1';
  carouselWrap.style.pointerEvents = 'auto';
}

// 7. События
captureBtn.addEventListener('click', takePhoto);
btnRetake.addEventListener('click', resetPhoto);

btnSend.addEventListener('click', () => {
  btnSend.textContent = 'Отправлено ✓';
  setTimeout(() => {
    btnSend.textContent = 'Отправить 🚀';
    resetPhoto();
  }, 1000);
});

btnEmpty.addEventListener('click', () => {
  triggerHaptic();
  alert(`№${String(selectedNumber).padStart(2, '0')} помечен как «Опустошён»`);
});

btnFlash.addEventListener('click', () => {
  flashEnabled = !flashEnabled;
  btnFlash.style.opacity = flashEnabled ? '1' : '0.4';
  triggerHaptic();
});

// Автостарт при загрузке
document.addEventListener('DOMContentLoaded', () => {
  buildCarousel();
  initVK();
  startCamera();
});
</script>
</body>
</html>
