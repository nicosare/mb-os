<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>VK Camera Terminal</title>
<style>
  :root {
    --accent: #2688eb;
    --yellow: #ffcc00;
    --danger: #ff5a5f;
    --page-pad: 16px;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Roboto, Arial, sans-serif;
  }

  body {
    overscroll-behavior: none;
  }

  button {
    font: inherit;
    -webkit-appearance: none;
    appearance: none;
  }

  #app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    overflow: hidden;
    background: #000;
  }

  /* ---------- Header ---------- */

  .top-bar {
    position: relative;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 58px;
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
    background: #000;
  }

  .room-badge {
    min-width: 66px;
    padding: 7px 15px;
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 999px;
    background: rgba(255,255,255,.09);
    color: #fff;
    font-size: 16px;
    line-height: 20px;
    font-weight: 700;
    text-align: center;
    letter-spacing: .2px;
    box-shadow: 0 4px 18px rgba(0,0,0,.18);
  }

  /* ---------- Camera ---------- */

  .viewport-container {
    position: relative;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #000;
  }

  .viewfinder {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0b0d;
    isolation: isolate;
  }

  /*
    Important:
    We intentionally do not force a 3:4 crop here.
    The stream is allowed to occupy the camera viewport without an
    artificial zoom/crop. This avoids the "closer than stock camera"
    effect caused by object-fit: cover + a mismatched aspect ratio.
  */
  #camera,
  #photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: #0b0b0d;
    object-fit: contain;
    object-position: center;
  }

  #camera {
    opacity: 0;
    transition: opacity .2s ease;
  }

  #camera.ready {
    opacity: 1;
  }

  #photo {
    z-index: 2;
    object-fit: contain;
  }

  .camera-overlay {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
  }

  .focus-corner {
    position: absolute;
    width: 24px;
    height: 24px;
    border-color: rgba(255,255,255,.78);
    border-style: solid;
    border-width: 0;
    opacity: .9;
  }

  .focus-corner.tl {
    top: 18px; left: 18px;
    border-top-width: 1px; border-left-width: 1px;
  }

  .focus-corner.tr {
    top: 18px; right: 18px;
    border-top-width: 1px; border-right-width: 1px;
  }

  .focus-corner.bl {
    bottom: 18px; left: 18px;
    border-bottom-width: 1px; border-left-width: 1px;
  }

  .focus-corner.br {
    bottom: 18px; right: 18px;
    border-bottom-width: 1px; border-right-width: 1px;
  }

  .camera-loader {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    padding: 24px;
    background: #0b0b0d;
    color: rgba(255,255,255,.65);
    font-size: 14px;
    text-align: center;
    transition: opacity .2s ease;
  }

  .camera-loader.error {
    color: rgba(255,255,255,.82);
  }

  .loader-spinner {
    width: 34px;
    height: 34px;
    border: 3px solid rgba(255,255,255,.11);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .75s linear infinite;
  }

  .loader-error-icon {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: rgba(255,255,255,.08);
    font-size: 20px;
  }

  .loader-title {
    font-weight: 700;
    color: #fff;
  }

  .loader-subtitle {
    max-width: 280px;
    line-height: 20px;
    color: rgba(255,255,255,.52);
  }

  .loader-retry {
    margin-top: 2px;
    padding: 10px 16px;
    border: 0;
    border-radius: 12px;
    background: #fff;
    color: #000;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  /* ---------- Bottom controls ---------- */

  .bottom-bar {
    position: relative;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 9px var(--page-pad) calc(env(safe-area-inset-bottom) + 16px);
    background: #000;
  }

  .carousel-wrap {
    width: min(100%, 430px);
    position: relative;
    transition: opacity .18s ease, filter .18s ease;
  }

  .carousel-wrap.disabled {
    opacity: .32;
    pointer-events: none;
  }

  .carousel-fade {
    position: absolute;
    top: 0;
    bottom: 0;
    z-index: 2;
    width: 42px;
    pointer-events: none;
  }

  .carousel-fade.left {
    left: 0;
    background: linear-gradient(90deg, #000 0%, rgba(0,0,0,0) 100%);
  }

  .carousel-fade.right {
    right: 0;
    background: linear-gradient(270deg, #000 0%, rgba(0,0,0,0) 100%);
  }

  .carousel {
    width: 100%;
    height: 44px;
    display: flex;
    align-items: center;
    gap: 0;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 0 calc(50% - 28px);
    scrollbar-width: none;
    scroll-snap-type: x mandatory;
    overscroll-behavior-x: contain;
    touch-action: pan-x;
  }

  .carousel::-webkit-scrollbar {
    display: none;
  }

  .num-item {
    flex: 0 0 56px;
    width: 56px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    scroll-snap-align: center;
    color: rgba(255,255,255,.36);
    font-size: 15px;
    font-weight: 600;
    line-height: 1;
    user-select: none;
    cursor: pointer;
    transition: color .12s ease, transform .12s ease, opacity .12s ease;
  }

  .num-item.near {
    color: rgba(255,255,255,.62);
  }

  .num-item.active {
    color: var(--yellow);
    font-size: 20px;
    font-weight: 800;
    transform: scale(1.08);
  }

  .shutter-grid {
    width: min(100%, 430px);
    min-height: 72px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 2px;
  }

  .grid-left { justify-self: start; }
  .grid-center { justify-self: center; }
  .grid-right { justify-self: end; }

  .btn-side {
    min-height: 42px;
    padding: 8px 11px;
    border: 0;
    background: transparent;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }

  .btn-side:active,
  .btn-send:active,
  .loader-retry:active {
    transform: scale(.96);
  }

  .btn-side.danger {
    color: var(--danger);
  }

  #captureBtn {
    position: relative;
    width: 74px;
    height: 74px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 4px solid #fff;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    transition: transform .12s ease, opacity .15s ease;
  }

  #captureBtn::after {
    content: "";
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    background: #fff;
  }

  #captureBtn:active {
    transform: scale(.93);
  }

  #captureBtn.busy {
    pointer-events: none;
    opacity: .45;
  }

  .capture-ring-label {
    position: absolute;
    left: 50%;
    bottom: -23px;
    transform: translateX(-50%);
    white-space: nowrap;
    color: rgba(255,255,255,.42);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .4px;
    pointer-events: none;
  }

  .btn-send {
    min-height: 42px;
    padding: 11px 16px;
    border: 0;
    border-radius: 14px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 5px 16px rgba(38,136,235,.20);
    transition: transform .12s ease, opacity .15s ease;
  }

  .btn-send.busy {
    opacity: .58;
    pointer-events: none;
  }

  .camera-message {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom) + 118px);
    z-index: 100;
    max-width: calc(100vw - 32px);
    padding: 10px 14px;
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 14px;
    background: rgba(26,26,28,.95);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    line-height: 18px;
    text-align: center;
    box-shadow: 0 12px 30px rgba(0,0,0,.35);
    opacity: 0;
    transform: translate(-50%, 10px);
    pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
  }

  .camera-message.visible {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .flash-effect {
    position: fixed;
    inset: 0;
    z-index: 90;
    pointer-events: none;
    background: #fff;
    opacity: 0;
  }

  .flash-effect.fire {
    animation: cameraFlash .16s ease-out both;
  }

  .hidden {
    display: none !important;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @keyframes cameraFlash {
    0% { opacity: 0; }
    35% { opacity: .96; }
    100% { opacity: 0; }
  }

  @media (min-width: 700px) {
    :root { --page-pad: 24px; }

    #app {
      max-width: 680px;
      margin: 0 auto;
      border-left: 1px solid rgba(255,255,255,.03);
      border-right: 1px solid rgba(255,255,255,.03);
    }
  }

  @media (max-height: 680px) {
    .top-bar { min-height: 50px; padding-top: calc(env(safe-area-inset-top) + 6px); padding-bottom: 6px; }
    .bottom-bar { gap: 8px; padding-bottom: calc(env(safe-area-inset-bottom) + 10px); }
    .shutter-grid { min-height: 64px; }
    #captureBtn { width: 66px; height: 66px; }
  }
</style>
</head>
<body>
<div id="app">
  <header class="top-bar">
    <div class="room-badge" id="roomBadge">№ 01</div>
  </header>

  <main class="viewport-container">
    <div class="viewfinder" id="viewfinder">
      <video id="camera" autoplay playsinline muted></video>
      <img id="photo" alt="Сделанный снимок" class="hidden">

      <div class="camera-overlay" aria-hidden="true">
        <span class="focus-corner tl"></span>
        <span class="focus-corner tr"></span>
        <span class="focus-corner bl"></span>
        <span class="focus-corner br"></span>
      </div>

      <div class="camera-loader" id="cameraLoader">
        <div class="loader-spinner" id="loaderSpinner"></div>
        <div class="loader-title" id="loaderTitle">Запуск камеры…</div>
        <div class="loader-subtitle" id="loaderSubtitle">Разреши доступ к камере, чтобы сделать снимок.</div>
        <button class="loader-retry hidden" id="loaderRetry" type="button">Повторить</button>
      </div>
    </div>
  </main>

  <footer class="bottom-bar">
    <div class="carousel-wrap" id="carouselWrap">
      <div class="carousel-fade left"></div>
      <div class="carousel" id="carousel" aria-label="Выбор номера"></div>
      <div class="carousel-fade right"></div>
    </div>

    <div class="shutter-grid" id="cameraActions">
      <div class="grid-left">
        <button class="btn-side danger" id="btnEmpty" type="button">Опустошён</button>
      </div>

      <div class="grid-center">
        <button id="captureBtn" type="button" aria-label="Сделать фото">
          <span class="capture-ring-label">Фото</span>
        </button>
      </div>

      <div class="grid-right"></div>
    </div>

    <div class="shutter-grid hidden" id="previewActions">
      <div class="grid-left">
        <button class="btn-side" id="btnRetake" type="button">✕ Переснять</button>
      </div>

      <div class="grid-center"></div>

      <div class="grid-right">
        <button class="btn-send" id="btnSend" type="button">Отправить&nbsp; ↑</button>
      </div>
    </div>
  </footer>
</div>

<div class="camera-message" id="message"></div>
<div class="flash-effect" id="flashEffect"></div>

<script type="module">
import bridge from 'https://cdn.jsdelivr.net/npm/@vkontakte/vk-bridge@3.0.2/+esm';

const video = document.getElementById('camera');
const photo = document.getElementById('photo');
const canvas = document.createElement('canvas');
const cameraLoader = document.getElementById('cameraLoader');
const loaderSpinner = document.getElementById('loaderSpinner');
const loaderTitle = document.getElementById('loaderTitle');
const loaderSubtitle = document.getElementById('loaderSubtitle');
const loaderRetry = document.getElementById('loaderRetry');
const carousel = document.getElementById('carousel');
const captureBtn = document.getElementById('captureBtn');
const btnRetake = document.getElementById('btnRetake');
const btnSend = document.getElementById('btnSend');
const btnEmpty = document.getElementById('btnEmpty');
const cameraActions = document.getElementById('cameraActions');
const previewActions = document.getElementById('previewActions');
const carouselWrap = document.getElementById('carouselWrap');
const roomBadge = document.getElementById('roomBadge');
const message = document.getElementById('message');
const flashEffect = document.getElementById('flashEffect');

let stream = null;
let videoTrack = null;
let imageCapture = null;
let photoCapabilities = null;
let selectedNumber = 1;
let previewUrl = null;
let snapTimer = null;
let messageTimer = null;
let isCapturing = false;
let isPreview = false;
let isVKReady = false;

/* ---------------------------------------------------------
   Small utilities
--------------------------------------------------------- */

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function showMessage(text, duration = 1800) {
  message.textContent = text;
  message.classList.add('visible');
  clearTimeout(messageTimer);
  messageTimer = setTimeout(() => message.classList.remove('visible'), duration);
}

function padNumber(n) {
  return String(n).padStart(2, '0');
}

function setBusy(button, busy) {
  button.classList.toggle('busy', busy);
  button.setAttribute('aria-busy', String(busy));
}

/* ---------------------------------------------------------
   VK Bridge
--------------------------------------------------------- */

async function initVK() {
  try {
    await bridge.send('VKWebAppInit');
    isVKReady = true;

    // The native VK swipe-back gesture can interfere with horizontal number scrolling.
    try {
      if (bridge.supports('VKWebAppDisableSwipeBack')) {
        await bridge.send('VKWebAppDisableSwipeBack');
      }
    } catch (_) {}
  } catch (error) {
    // The camera itself must still work in a normal browser / fallback environment.
    isVKReady = false;
  }
}

async function triggerHaptic() {
  try {
    if (isVKReady && bridge.supports('VKWebAppTapticSelectionChanged')) {
      await bridge.send('VKWebAppTapticSelectionChanged');
      return;
    }
  } catch (_) {}

  // The native VK haptic is preferred. Vibrate is only a fallback.
  try {
    if (navigator.vibrate) navigator.vibrate(8);
  } catch (_) {}
}

async function setVKFlashLevel(level) {
  if (!isVKReady) return false;

  try {
    if (!bridge.supports('VKWebAppFlashSetLevel')) return false;
    await bridge.send('VKWebAppFlashSetLevel', { level });
    return true;
  } catch (_) {
    return false;
  }
}

/* ---------------------------------------------------------
   Camera permissions / lifecycle
--------------------------------------------------------- */

function resetLoader() {
  cameraLoader.classList.remove('error');
  loaderSpinner.classList.remove('hidden');
  loaderRetry.classList.add('hidden');
  loaderTitle.textContent = 'Запуск камеры…';
  loaderSubtitle.textContent = 'Разреши доступ к камере, чтобы сделать снимок.';
}

function showCameraError(error) {
  cameraLoader.classList.add('error');
  loaderSpinner.classList.add('hidden');
  loaderRetry.classList.remove('hidden');
  loaderTitle.textContent = 'Не удалось открыть камеру';

  if (error?.name === 'NotAllowedError' || error?.name === 'SecurityError') {
    loaderSubtitle.textContent = 'Проверь разрешение на камеру для VK и открой миниапп заново.';
  } else if (error?.name === 'NotFoundError' || error?.name === 'DevicesNotFoundError') {
    loaderSubtitle.textContent = 'Камера на этом устройстве не найдена.';
  } else {
    loaderSubtitle.textContent = 'Попробуй повторить запуск. Камера должна открываться по HTTPS.';
  }
}

async function stopCamera() {
  if (stream) {
    for (const track of stream.getTracks()) {
      try { track.stop(); } catch (_) {}
    }
  }

  stream = null;
  videoTrack = null;
  imageCapture = null;
  photoCapabilities = null;
  video.srcObject = null;
  video.classList.remove('ready');
}

async function startCamera() {
  resetLoader();
  await stopCamera();

  if (!navigator.mediaDevices?.getUserMedia) {
    const error = new Error('getUserMedia is unavailable');
    error.name = 'NotSupportedError';
    showCameraError(error);
    return;
  }

  try {
    /*
      Do NOT force 1920x1080.
      That was a major source of the artificial zoom: a 16:9 stream was
      being cropped into a portrait 3:4 container.

      We ask for a natural mobile camera stream and a 4:3-ish photo first,
      while leaving the browser free to select the closest sensor mode.
    */
    const constraints = {
      audio: false,
      video: {
        facingMode: { ideal: 'environment' },
        aspectRatio: { ideal: 4 / 3 },
        width: { ideal: 1920 },
        height: { ideal: 1440 }
      }
    };

    try {
      stream = await navigator.mediaDevices.getUserMedia(constraints);
    } catch (firstError) {
      // Some Android camera implementations reject the ideal aspect ratio.
      // Fall back to the simplest stable rear-camera request.
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: 'environment' } }
      });
    }

    videoTrack = stream.getVideoTracks()[0] || null;
    video.srcObject = stream;

    if (!videoTrack) throw new Error('Video track is missing');

    // Prefer ImageCapture for actual still photos. It avoids taking a low-quality
    // screenshot from the scaled preview and gives us access to a real flash mode.
    if ('ImageCapture' in window) {
      try {
        imageCapture = new ImageCapture(videoTrack);
        photoCapabilities = await imageCapture.getPhotoCapabilities();
      } catch (_) {
        imageCapture = null;
        photoCapabilities = null;
      }
    }

    await new Promise((resolve, reject) => {
      const timeout = setTimeout(() => reject(new Error('Camera start timeout')), 8000);

      const done = () => {
        clearTimeout(timeout);
        resolve();
      };

      if (video.readyState >= HTMLMediaElement.HAVE_METADATA) {
        done();
      } else {
        video.addEventListener('loadedmetadata', done, { once: true });
      }
    });

    await video.play();
    video.classList.add('ready');

    cameraLoader.style.opacity = '0';
    setTimeout(() => cameraLoader.classList.add('hidden'), 220);
  } catch (error) {
    console.error('[camera]', error);
    await stopCamera();
    showCameraError(error);
  }
}

/* ---------------------------------------------------------
   Flash
--------------------------------------------------------- */

function supportsNativePhotoFlash() {
  const modes = photoCapabilities?.fillLightMode;
  return Array.isArray(modes) && modes.includes('flash');
}

async function enableTorchFallback() {
  if (!videoTrack?.applyConstraints) return false;

  try {
    const capabilities = typeof videoTrack.getCapabilities === 'function'
      ? videoTrack.getCapabilities()
      : {};

    if (!('torch' in capabilities)) return false;

    await videoTrack.applyConstraints({ advanced: [{ torch: true }] });
    return true;
  } catch (_) {
    return false;
  }
}

async function disableTorchFallback() {
  if (!videoTrack?.applyConstraints) return;

  try {
    await videoTrack.applyConstraints({ advanced: [{ torch: false }] });
  } catch (_) {}
}

async function takeNativePhoto() {
  if (!imageCapture) return null;

  try {
    if (supportsNativePhotoFlash()) {
      return await imageCapture.takePhoto({ fillLightMode: 'flash' });
    }

    // No real camera-flash mode exposed by the browser.
    // Try VK/native torch only as a fallback; this is not equivalent to a flash.
    const vkFlash = await setVKFlashLevel(1);
    const torch = vkFlash ? false : await enableTorchFallback();

    await sleep(90);
    const blob = await imageCapture.takePhoto();

    if (vkFlash) await setVKFlashLevel(0);
    if (torch) await disableTorchFallback();

    return blob;
  } catch (error) {
    try { await setVKFlashLevel(0); } catch (_) {}
    await disableTorchFallback();
    throw error;
  }
}

function runVisualFlash() {
  flashEffect.classList.remove('fire');
  // Force reflow so repeated photos still animate the flash.
  void flashEffect.offsetWidth;
  flashEffect.classList.add('fire');
}

/* ---------------------------------------------------------
   Fallback frame capture
--------------------------------------------------------- */

function getVideoRotation() {
  const angle = Number(screen.orientation?.angle ?? window.orientation ?? 0);
  const normalized = ((angle % 360) + 360) % 360;
  return normalized;
}

function drawVideoToCanvas() {
  const vW = video.videoWidth;
  const vH = video.videoHeight;
  if (!vW || !vH) throw new Error('Camera frame is not ready');

  const angle = getVideoRotation();

  if (angle === 90 || angle === 270) {
    canvas.width = vH;
    canvas.height = vW;
  } else {
    canvas.width = vW;
    canvas.height = vH;
  }

  const ctx = canvas.getContext('2d', { alpha: false });
  if (!ctx) throw new Error('Canvas is unavailable');

  ctx.save();

  if (angle === 90) {
    ctx.translate(canvas.width, 0);
    ctx.rotate(Math.PI / 2);
  } else if (angle === 180) {
    ctx.translate(canvas.width, canvas.height);
    ctx.rotate(Math.PI);
  } else if (angle === 270) {
    ctx.translate(0, canvas.height);
    ctx.rotate(-Math.PI / 2);
  }

  ctx.drawImage(video, 0, 0, vW, vH);
  ctx.restore();

  return canvas.toDataURL('image/jpeg', .94);
}

/* ---------------------------------------------------------
   Photo preview state
--------------------------------------------------------- */

function releasePreviewUrl() {
  if (previewUrl) {
    URL.revokeObjectURL(previewUrl);
    previewUrl = null;
  }
}

function showPreview(source) {
  releasePreviewUrl();

  if (source instanceof Blob) {
    previewUrl = URL.createObjectURL(source);
    photo.src = previewUrl;
  } else {
    photo.src = source;
  }

  video.classList.remove('ready');
  video.classList.add('hidden');
  photo.classList.remove('hidden');

  cameraActions.classList.add('hidden');
  previewActions.classList.remove('hidden');
  carouselWrap.classList.add('disabled');

  isPreview = true;
}

function resetPhoto() {
  // Explicit state reset first, then hide the actual image element.
  // This fixes stale preview frames remaining visible after Retake.
  isPreview = false;

  previewActions.classList.add('hidden');
  cameraActions.classList.remove('hidden');
  carouselWrap.classList.remove('disabled');

  photo.classList.add('hidden');
  photo.removeAttribute('src');
  photo.removeAttribute('style');

  releasePreviewUrl();

  video.classList.remove('hidden');
  video.classList.add('ready');

  try { video.play(); } catch (_) {}
}

/* ---------------------------------------------------------
   Number carousel
--------------------------------------------------------- */

function buildCarousel() {
  const fragment = document.createDocumentFragment();

  for (let i = 1; i <= 100; i++) {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'num-item';
    el.dataset.number = String(i);
    el.textContent = padNumber(i);
    el.setAttribute('aria-label', `Номер ${padNumber(i)}`);
    fragment.appendChild(el);
  }

  carousel.appendChild(fragment);

  requestAnimationFrame(() => {
    selectNumber(1, false, 'auto');
  });
}

function updateActiveNumber(el, vibrate = false) {
  if (!el) return;

  const n = Number(el.dataset.number);
  const changed = n !== selectedNumber;
  selectedNumber = n;

  const items = carousel.querySelectorAll('.num-item');
  items.forEach(item => {
    const itemNumber = Number(item.dataset.number);
    item.classList.toggle('active', item === el);
    item.classList.toggle('near', Math.abs(itemNumber - selectedNumber) <= 2);
  });

  roomBadge.textContent = `№ ${padNumber(selectedNumber)}`;

  if (vibrate && changed) triggerHaptic();
}

function selectNumber(n, vibrate = true, behavior = 'smooth') {
  const number = Math.max(1, Math.min(100, Number(n) || 1));
  const el = carousel.querySelector(`[data-number="${number}"]`);
  if (!el) return;

  updateActiveNumber(el, vibrate);
  el.scrollIntoView({ behavior, inline: 'center', block: 'nearest' });
}

function updateNumberFromScroll() {
  const items = carousel.querySelectorAll('.num-item');
  if (!items.length) return;

  const carouselRect = carousel.getBoundingClientRect();
  const center = carouselRect.left + carouselRect.width / 2;

  let closest = null;
  let minDistance = Infinity;

  items.forEach(el => {
    const rect = el.getBoundingClientRect();
    const itemCenter = rect.left + rect.width / 2;
    const distance = Math.abs(itemCenter - center);

    if (distance < minDistance) {
      minDistance = distance;
      closest = el;
    }
  });

  if (closest) updateActiveNumber(closest, true);
}

carousel.addEventListener('scroll', () => {
  updateNumberFromScroll();

  clearTimeout(snapTimer);
  snapTimer = setTimeout(() => {
    updateNumberFromScroll();
  }, 90);
}, { passive: true });

carousel.addEventListener('click', event => {
  const item = event.target.closest('.num-item');
  if (!item) return;
  selectNumber(Number(item.dataset.number));
});

/* ---------------------------------------------------------
   Capture
--------------------------------------------------------- */

async function takePhoto() {
  if (isCapturing || isPreview || !videoTrack) return;
  if (!video.videoWidth || !video.videoHeight) {
    showMessage('Камера ещё не готова');
    return;
  }

  isCapturing = true;
  setBusy(captureBtn, true);

  try {
    let source = null;

    // Best path: native still photo from the camera.
    if (imageCapture) {
      source = await takeNativePhoto();
      runVisualFlash();
    }

    // Fallback: capture the visible camera stream to canvas.
    if (!source) {
      const torchViaVK = await setVKFlashLevel(1);
      const torch = torchViaVK ? false : await enableTorchFallback();

      // Give the LED a moment to reach full brightness before grabbing the frame.
      await sleep(100);
      source = drawVideoToCanvas();

      if (torchViaVK) await setVKFlashLevel(0);
      if (torch) await disableTorchFallback();

      runVisualFlash();
    }

    showPreview(source);
    await triggerHaptic();
  } catch (error) {
    console.error('[capture]', error);
    showMessage('Не удалось сделать снимок. Попробуй ещё раз.', 2200);
  } finally {
    isCapturing = false;
    setBusy(captureBtn, false);
  }
}

/* ---------------------------------------------------------
   UI events
--------------------------------------------------------- */

captureBtn.addEventListener('click', takePhoto);

btnRetake.addEventListener('click', () => {
  resetPhoto();
  triggerHaptic();
});

btnSend.addEventListener('click', async () => {
  if (!isPreview || btnSend.classList.contains('busy')) return;

  setBusy(btnSend, true);
  const original = btnSend.innerHTML;
  btnSend.textContent = 'Отправка…';

  /*
    This is intentionally still a UI placeholder.
    Put the real VK message/upload flow here later.
  */
  await sleep(650);

  btnSend.textContent = 'Отправлено ✓';
  await triggerHaptic();

  setTimeout(() => {
    btnSend.innerHTML = original;
    setBusy(btnSend, false);
    resetPhoto();
  }, 650);
});

btnEmpty.addEventListener('click', async () => {
  await triggerHaptic();
  showMessage(`№ ${padNumber(selectedNumber)} помечен как «Опустошён»`);
});

loaderRetry.addEventListener('click', startCamera);

window.addEventListener('pagehide', () => {
  stopCamera();
  releasePreviewUrl();
});

window.addEventListener('beforeunload', () => {
  stopCamera();
  releasePreviewUrl();
});

/* ---------------------------------------------------------
   Start
--------------------------------------------------------- */

(async function boot() {
  buildCarousel();
  await initVK();
  await startCamera();
})();
</script>
