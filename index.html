<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>VK Camera Terminal</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
    color: #fff;
  }

  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: #000;
  }

  /* Верхняя панель */
  .top-bar {
    padding: calc(env(safe-area-inset-top) + 12px) 20px 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    background: #000;
  }

  .room-badge {
    background: rgba(255, 255, 255, 0.12);
    padding: 6px 18px;
    border-radius: 20px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  /* Видоискатель камеры (Пропорции 3:4) */
  .viewport-container {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    overflow: hidden;
  }

  .viewfinder {
    width: 100%;
    max-width: 100vw;
    aspect-ratio: 3 / 4;
    position: relative;
    overflow: hidden;
    background: #0d0d0d;
  }

  #camera, #photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  #photo { display: none; }

  /* Плавный лоадер загрузки камеры */
  .camera-loader {
    position: absolute;
    inset: 0;
    background: #0d0d0d;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 5;
    color: rgba(255, 255, 255, 0.6);
    font-size: 14px;
    transition: opacity 0.3s ease;
  }

  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid rgba(255, 255, 255, 0.1);
    border-top-color: #2688eb;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Нижняя панель и карусель */
  .bottom-bar {
    background: #000;
    padding: 12px 16px calc(env(safe-area-inset-bottom) + 20px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .carousel-wrap {
    width: 100%;
    max-width: 400px;
    position: relative;
  }

  .carousel {
    height: 44px;
    display: flex;
    align-items: center;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    padding: 0 calc(50% - 28px);
  }
  .carousel::-webkit-scrollbar { display: none; }

  .num-item {
    flex: 0 0 56px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    scroll-snap-align: center;
    font-size: 16px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.4);
    transition: color 0.15s, transform 0.15s;
    cursor: pointer;
  }

  .num-item.active {
    color: #ffcc00;
    font-size: 20px;
    font-weight: 700;
    transform: scale(1.1);
  }

  /* Строго центрированная сетка кнопок управления */
  .shutter-grid {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 8px;
  }

  .grid-left { justify-self: start; }
  .grid-center { justify-self: center; }
  .grid-right { justify-self: end; }

  .btn-side {
    background: transparent;
    border: none;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    padding: 8px 12px;
  }

  .btn-side.danger { color: #ff4e4e; }

  #captureBtn {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: transparent;
    border: 4px solid #ffffff;
    padding: 3px;
    cursor: pointer;
  }
  #captureBtn:active { transform: scale(0.93); }
  #captureBtn span {
    display: block;
    width: 100%;
    height: 100%;
    background: #ffffff;
    border-radius: 50%;
  }

  .btn-send {
    background: #2688eb;
    color: #fff;
    border: none;
    padding: 12px 20px;
    border-radius: 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="app">
  <!-- Шапка -->
  <div class="top-bar">
    <div class="room-badge" id="roomBadge">№ 01</div>
  </div>

  <!-- Видоискатель камеры -->
  <div class="viewport-container">
    <div class="viewfinder">
      <!-- Лоадер -->
      <div class="camera-loader" id="cameraLoader">
        <div class="spinner"></div>
        <span>Запуск камеры...</span>
      </div>

      <video id="camera" autoplay playsinline muted></video>
      <img id="photo" alt="Снимок">
    </div>
  </div>

  <!-- Нижняя панель -->
  <div class="bottom-bar">
    <!-- Карусель номеров -->
    <div class="carousel-wrap" id="carouselWrap">
      <div class="carousel" id="carousel"></div>
    </div>

    <!-- Панель затвора (Строго по центру) -->
    <div class="shutter-grid" id="cameraActions">
      <div class="grid-left">
        <button class="btn-side danger" id="btnEmpty">Опустошён</button>
      </div>
      <div class="grid-center">
        <button id="captureBtn" aria-label="Сделать фото"><span></span></button>
      </div>
      <div class="grid-right"></div>
    </div>

    <!-- Панель превью -->
    <div class="shutter-grid hidden" id="previewActions">
      <div class="grid-left">
        <button class="btn-side" id="btnRetake">✕ Переснять</button>
      </div>
      <div class="grid-center"></div>
      <div class="grid-right">
        <button class="btn-send" id="btnSend">Отправить 🚀</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import bridge from 'https://cdn.jsdelivr.net/npm/@vkontakte/vk-bridge@3.0.2/+esm';

const video = document.getElementById('camera');
const photo = document.getElementById('photo');
const canvas = document.createElement('canvas');
const cameraLoader = document.getElementById('cameraLoader');
const carousel = document.getElementById('carousel');
const captureBtn = document.getElementById('captureBtn');
const btnRetake = document.getElementById('btnRetake');
const btnSend = document.getElementById('btnSend');
const btnEmpty = document.getElementById('btnEmpty');
const cameraActions = document.getElementById('cameraActions');
const previewActions = document.getElementById('previewActions');
const carouselWrap = document.getElementById('carouselWrap');
const roomBadge = document.getElementById('roomBadge');

let stream = null;
let selectedNumber = 1;
let snapTimer = null;

// 1. Инициализация VK Bridge
async function initVK() {
  try { await bridge.send('VKWebAppInit'); } catch(e){}
}

// 2. Вибрация
async function triggerHaptic() {
  try {
    if (bridge.supports('VKWebAppTapticSelectionChanged')) {
      await bridge.send('VKWebAppTapticSelectionChanged');
      return;
    }
  } catch(e){}
  if (navigator.vibrate) navigator.vibrate(10);
}

// 3. Управление вспышкой (Torch)
async function setFlash(enable) {
  const level = enable ? 1 : 0;
  
  // Метод 1: Через VK Bridge
  try {
    if (bridge.supports('VKWebAppFlashSetLevel')) {
      await bridge.send('VKWebAppFlashSetLevel', { level });
    }
  } catch(e){}

  // Метод 2: Напрямую через MediaStreamTrack камеры
  if (stream) {
    const track = stream.getVideoTracks()[0];
    if (track && track.applyConstraints) {
      try {
        await track.applyConstraints({ advanced: [{ torch: enable }] });
      } catch(e){}
    }
  }
}

// 4. Мгновенный запуск камеры
async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    video.srcObject = stream;
    
    video.onloadeddata = () => {
      cameraLoader.style.opacity = '0';
      setTimeout(() => cameraLoader.classList.add('hidden'), 300);
    };
    
    await video.play();
  } catch(e) {
    console.error('Ошибка камеры:', e);
    cameraLoader.querySelector('span').textContent = 'Ошибка доступа к камере';
  }
}

// 5. Карусель номеров
function buildCarousel() {
  const frag = document.createDocumentFragment();
  for (let i = 1; i <= 100; i++) {
    const el = document.createElement('div');
    el.className = 'num-item';
    el.dataset.number = i;
    el.textContent = String(i).padStart(2, '0');
    frag.appendChild(el);
  }
  carousel.appendChild(frag);
  requestAnimationFrame(() => selectNumber(1, false));
}

function selectNumber(n, vibrate = true) {
  selectedNumber = Math.max(1, Math.min(100, n));
  const el = carousel.querySelector(`[data-number="${selectedNumber}"]`);
  if (!el) return;
  
  el.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  carousel.querySelectorAll('.num-item.active').forEach(x => x.classList.remove('active'));
  el.classList.add('active');
  
  roomBadge.textContent = `№ ${String(selectedNumber).padStart(2, '0')}`;
  if (vibrate) triggerHaptic();
}

function updateNumberFromScroll() {
  const items = [...carousel.querySelectorAll('.num-item')];
  const center = carousel.getBoundingClientRect().left + carousel.clientWidth / 2;
  let closest = null;
  let minDistance = Infinity;

  for (const el of items) {
    const rect = el.getBoundingClientRect();
    const distance = Math.abs((rect.left + rect.width / 2) - center);
    if (distance < minDistance) {
      minDistance = distance;
      closest = el;
    }
  }

  if (closest) {
    const num = Number(closest.dataset.number);
    if (num !== selectedNumber) {
      selectedNumber = num;
      items.forEach(x => x.classList.toggle('active', x === closest));
      roomBadge.textContent = `№ ${String(selectedNumber).padStart(2, '0')}`;
      triggerHaptic();
    }
  }
}

carousel.addEventListener('scroll', () => {
  updateNumberFromScroll();
  clearTimeout(snapTimer);
  snapTimer = setTimeout(updateNumberFromScroll, 100);
}, { passive: true });

carousel.addEventListener('click', (e) => {
  const item = e.target.closest('.num-item');
  if (item) selectNumber(Number(item.dataset.number));
});

// 6. Съемка со вспышкой и правильным поворотом фото
async function takePhoto() {
  if (!video.videoWidth) return;

  // 1. Включаем вспышку
  await setFlash(true);

  // 2. Пауза 300мс, чтобы сенсор успел зафиксировать яркий кадр
  await new Promise(resolve => setTimeout(resolve, 300));

  // 3. Вычисление ориентации для разворота кадра
  const angle = (screen.orientation && screen.orientation.angle !== undefined) 
    ? screen.orientation.angle 
    : (window.orientation || 0);

  const vW = video.videoWidth;
  const vH = video.videoHeight;

  // Если телефон развернут набок (90 или 270 град)
  if (angle === 90 || angle === -90 || angle === 270) {
    canvas.width = vH;
    canvas.height = vW;
  } else {
    canvas.width = vW;
    canvas.height = vH;
  }

  const ctx = canvas.getContext('2d');
  ctx.save();

  // Трансформация контекста в зависимости от поворота
  if (angle === 90) {
    ctx.translate(canvas.width, 0);
    ctx.rotate((90 * Math.PI) / 180);
  } else if (angle === 180) {
    ctx.translate(canvas.width, canvas.height);
    ctx.rotate((180 * Math.PI) / 180);
  } else if (angle === 270 || angle === -90) {
    ctx.translate(0, canvas.height);
    ctx.rotate((-90 * Math.PI) / 180);
  }

  ctx.drawImage(video, 0, 0, vW, vH);
  ctx.restore();

  // 4. Выключаем вспышку
  await setFlash(false);
  await triggerHaptic();

  // 5. Показ превью
  photo.src = canvas.toDataURL('image/jpeg', 0.92);
  photo.style.display = 'block';
  video.style.display = 'none';

  cameraActions.classList.add('hidden');
  previewActions.classList.remove('hidden');
  carouselWrap.style.opacity = '0.3';
  carouselWrap.style.pointerEvents = 'none';
}

// Полный сброс превью
function resetPhoto() {
  photo.style.display = 'none';
  photo.src = ''; // Полное очищение ресурса картинки
  video.style.display = 'block';

  previewActions.classList.add('hidden');
  cameraActions.classList.remove('hidden');
  carouselWrap.style.opacity = '1';
  carouselWrap.style.pointerEvents = 'auto';
}

// 7. Обработчики событий
captureBtn.addEventListener('click', takePhoto);
btnRetake.addEventListener('click', resetPhoto);

btnSend.addEventListener('click', () => {
  btnSend.textContent = 'Отправлено ✓';
  setTimeout(() => {
    btnSend.textContent = 'Отправить 🚀';
    resetPhoto();
  }, 1000);
});

btnEmpty.addEventListener('click', () => {
  triggerHaptic();
  alert(`№${String(selectedNumber).padStart(2, '0')} помечен как «Опустошён»`);
});

// Автостарт
document.addEventListener('DOMContentLoaded', () => {
  buildCarousel();
  initVK();
  startCamera();
});
</script>
</body>
</html>
