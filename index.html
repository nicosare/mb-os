<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>VK Camera Terminal</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: #fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    Roboto,
    sans-serif;
}

button {
  font: inherit;
}

#app {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: #000;
  overflow: hidden;
}

/* =========================
   TOP
========================= */

.top-bar {
  flex: 0 0 auto;
  min-height: 64px;
  padding:
    calc(env(safe-area-inset-top) + 10px)
    18px
    10px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #000;
  z-index: 20;
}

.room-badge {
  min-width: 76px;
  padding: 7px 16px;
  border-radius: 999px;

  background: rgba(255,255,255,.11);

  color: #fff;
  text-align: center;

  font-size: 16px;
  font-weight: 700;
  letter-spacing: .3px;

  transition: transform .18s ease;
}

.room-badge.bump {
  transform: scale(1.06);
}


/* =========================
   CAMERA
========================= */

.viewport-container {
  min-height: 0;
  flex: 1 1 auto;

  position: relative;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;
  background: #000;
}

.viewfinder {
  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;
  background: #000;
}

/*
 * Не используем 3:4 + object-fit:cover.
 * Это и было одной из причин искусственного зума.
 */

#camera {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  display: block;

  object-fit: contain;

  background: #000;
}

/*
 * Превью НЕ вращается CSS-ом.
 * Изображение предварительно нормализуется
 * в canvas.
 */

#photo {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  display: none;

  object-fit: contain;

  background: #000;
}


/* =========================
   FLASH
========================= */

.flash-overlay {
  position: absolute;
  inset: 0;

  z-index: 15;
  pointer-events: none;

  background: #fff;
  opacity: 0;
}

.flash-overlay.fire {
  animation: cameraFlash .22s ease-out;
}

@keyframes cameraFlash {
  0% {
    opacity: 0;
  }

  15% {
    opacity: .95;
  }

  100% {
    opacity: 0;
  }
}


/* =========================
   LOADER
========================= */

.camera-loader {
  position: absolute;
  inset: 0;

  z-index: 10;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  gap: 13px;

  background: #0b0b0b;

  color: rgba(255,255,255,.62);
  font-size: 14px;

  transition: opacity .22s ease;
}

.spinner {
  width: 34px;
  height: 34px;

  border-radius: 50%;

  border: 3px solid rgba(255,255,255,.12);
  border-top-color: #2688eb;

  animation: spin .75s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.camera-error {
  display: none;

  flex-direction: column;
  align-items: center;

  gap: 12px;

  text-align: center;

  padding: 24px;
}

.camera-error.show {
  display: flex;
}

.retry-camera {
  border: 0;

  border-radius: 999px;

  padding: 10px 18px;

  background: #2688eb;
  color: #fff;

  font-weight: 650;
}


/* =========================
   BOTTOM
========================= */

.bottom-bar {
  flex: 0 0 auto;

  padding:
    10px
    16px
    calc(env(safe-area-inset-bottom) + 18px);

  background: #000;

  display: flex;
  flex-direction: column;

  align-items: center;

  gap: 14px;

  z-index: 20;
}


/* =========================
   CAROUSEL
========================= */

.carousel-wrap {
  width: 100%;
  max-width: 420px;

  position: relative;

  transition: opacity .2s ease;
}

.carousel {
  height: 46px;

  display: flex;
  align-items: center;

  overflow-x: auto;
  overflow-y: hidden;

  scroll-snap-type: x mandatory;

  scrollbar-width: none;

  overscroll-behavior-x: contain;

  padding: 0 calc(50% - 28px);
}

.carousel::-webkit-scrollbar {
  display: none;
}

.num-item {
  flex: 0 0 56px;

  height: 42px;

  display: flex;
  align-items: center;
  justify-content: center;

  scroll-snap-align: center;

  color: rgba(255,255,255,.38);

  font-size: 16px;
  font-weight: 550;

  user-select: none;

  transition:
    color .12s,
    transform .12s;
}

.num-item.active {
  color: #ffcc00;

  font-size: 20px;
  font-weight: 750;

  transform: scale(1.08);
}


/* =========================
   BUTTON GRID
========================= */

.shutter-grid {
  width: 100%;
  max-width: 520px;

  display: grid;

  grid-template-columns: 1fr auto 1fr;

  align-items: center;

  padding: 0 4px;
}

.grid-left {
  justify-self: start;
}

.grid-center {
  justify-self: center;
}

.grid-right {
  justify-self: end;
}


/* =========================
   SIDE BUTTONS
========================= */

.btn-side {
  border: 0;

  background: transparent;

  color: #fff;

  padding: 9px 10px;

  border-radius: 12px;

  font-size: 15px;
  font-weight: 650;
}

.btn-side:active {
  background: rgba(255,255,255,.08);
}

.btn-side.danger {
  color: #ff5b5b;
}


/* =========================
   SHUTTER
========================= */

#captureBtn {
  width: 72px;
  height: 72px;

  border-radius: 50%;

  padding: 4px;

  border: 4px solid #fff;

  background: transparent;

  box-shadow:
    0 0 0 1px rgba(255,255,255,.08);
}

#captureBtn span {
  display: block;

  width: 100%;
  height: 100%;

  border-radius: 50%;

  background: #fff;

  transition: transform .12s ease;
}

#captureBtn:active span {
  transform: scale(.91);
}

#captureBtn:disabled {
  opacity: .45;
}


/* =========================
   SEND
========================= */

.btn-send {
  border: 0;

  padding: 11px 18px;

  border-radius: 999px;

  background: #2688eb;

  color: #fff;

  font-size: 15px;
  font-weight: 700;

  box-shadow:
    0 5px 18px rgba(38,136,235,.20);
}

.btn-send:active {
  transform: scale(.97);
}

.btn-send:disabled {
  opacity: .65;
}

.hidden {
  display: none !important;
}


/* =========================
   LANDSCAPE
========================= */

@media (orientation: landscape) {

  .top-bar {
    min-height: 52px;

    padding-top: 8px;
    padding-bottom: 7px;
  }

  .bottom-bar {
    padding-top: 7px;
    padding-bottom: 10px;

    gap: 8px;
  }

  .carousel {
    height: 40px;
  }

  #captureBtn {
    width: 64px;
    height: 64px;
  }
}
</style>
</head>

<body>

<div id="app">

  <header class="top-bar">
    <div class="room-badge" id="roomBadge">
      № 01
    </div>
  </header>


  <main class="viewport-container">

    <div class="viewfinder">

      <div class="camera-loader" id="cameraLoader">

        <div class="spinner"></div>

        <span id="loaderText">
          Запуск камеры…
        </span>

        <div
          class="camera-error"
          id="cameraError"
        >

          <span>
            Не удалось получить доступ к камере.
          </span>

          <button
            class="retry-camera"
            id="retryCamera"
          >
            Повторить
          </button>

        </div>

      </div>


      <video
        id="camera"
        autoplay
        playsinline
        muted
      ></video>


      <img
        id="photo"
        alt="Снятая фотография"
      >


      <div
        class="flash-overlay"
        id="flashOverlay"
      ></div>

    </div>

  </main>


  <footer class="bottom-bar">

    <div
      class="carousel-wrap"
      id="carouselWrap"
    >

      <div
        class="carousel"
        id="carousel"
      ></div>

    </div>


    <div
      class="shutter-grid"
      id="cameraActions"
    >

      <div class="grid-left">

        <button
          class="btn-side danger"
          id="btnEmpty"
        >
          Опустошён
        </button>

      </div>


      <div class="grid-center">

        <button
          id="captureBtn"
          aria-label="Сделать фото"
        >
          <span></span>
        </button>

      </div>


      <div class="grid-right"></div>

    </div>


    <div
      class="shutter-grid hidden"
      id="previewActions"
    >

      <div class="grid-left">

        <button
          class="btn-side"
          id="btnRetake"
        >
          ✕ Переснять
        </button>

      </div>


      <div class="grid-center"></div>


      <div class="grid-right">

        <button
          class="btn-send"
          id="btnSend"
        >
          Отправить&nbsp;🚀
        </button>

      </div>

    </div>

  </footer>

</div>


<script type="module">

import bridge from
  'https://cdn.jsdelivr.net/npm/@vkontakte/vk-bridge@3.0.2/+esm';


/* ==========================================================
   DOM
========================================================== */

const $ = id =>
  document.getElementById(id);

const video =
  $('camera');

const photo =
  $('photo');

const canvas =
  document.createElement('canvas');

const cameraLoader =
  $('cameraLoader');

const loaderText =
  $('loaderText');

const cameraError =
  $('cameraError');

const retryCamera =
  $('retryCamera');

const flashOverlay =
  $('flashOverlay');

const carousel =
  $('carousel');

const carouselWrap =
  $('carouselWrap');

const roomBadge =
  $('roomBadge');

const captureBtn =
  $('captureBtn');

const btnRetake =
  $('btnRetake');

const btnSend =
  $('btnSend');

const btnEmpty =
  $('btnEmpty');

const cameraActions =
  $('cameraActions');

const previewActions =
  $('previewActions');


/* ==========================================================
   STATE
========================================================== */

let stream = null;
let imageCapture = null;

let selectedNumber = 1;

let previewUrl = null;

let snapTimer = null;

let isTakingPhoto = false;


/* ==========================================================
   VK
========================================================== */

async function initVK() {

  try {
    await bridge.send(
      'VKWebAppInit'
    );
  } catch (_) {}

}


/* ==========================================================
   HAPTICS
========================================================== */

async function haptic(type = 'selection') {

  try {

    if (
      type === 'selection' &&
      bridge.supports(
        'VKWebAppTapticSelectionChanged'
      )
    ) {

      await bridge.send(
        'VKWebAppTapticSelectionChanged'
      );

      return;
    }

    if (
      type === 'impact' &&
      bridge.supports(
        'VKWebAppTapticImpactOccurred'
      )
    ) {

      await bridge.send(
        'VKWebAppTapticImpactOccurred',
        {
          style: 'light'
        }
      );

      return;
    }

  } catch (_) {}

  if (navigator.vibrate) {
    navigator.vibrate(
      type === 'impact'
        ? 15
        : 8
    );
  }
}


/* ==========================================================
   LOADER
========================================================== */

function showCameraLoading(
  text = 'Запуск камеры…'
) {

  cameraLoader.classList.remove(
    'hidden'
  );

  cameraLoader.style.opacity = '1';

  loaderText.textContent = text;

  cameraError.classList.remove(
    'show'
  );
}


function hideCameraLoading() {

  cameraLoader.style.opacity = '0';

  setTimeout(() => {

    cameraLoader.classList.add(
      'hidden'
    );

  }, 220);
}


function showCameraError() {

  cameraLoader.classList.remove(
    'hidden'
  );

  cameraLoader.style.opacity = '1';

  loaderText.textContent = '';

  cameraError.classList.add(
    'show'
  );
}


/* ==========================================================
   CAMERA STOP
========================================================== */

function stopCamera() {

  if (stream) {

    stream
      .getTracks()
      .forEach(track => {
        track.stop();
      });

    stream = null;
  }

  imageCapture = null;

  video.srcObject = null;
}


/* ==========================================================
   CAMERA START
========================================================== */

async function startCamera() {

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showCameraError();

    return;
  }

  stopCamera();

  showCameraLoading();


  try {

    /*
     * Не задаём 1920x1080.
     * Браузер сам выбирает оптимальный
     * нативный режим камеры.
     */

    stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {
            facingMode: {
              ideal: 'environment'
            }
          },

          audio: false

        });


    const track =
      stream.getVideoTracks()[0];


    if (
      'ImageCapture' in window &&
      track
    ) {

      try {

        imageCapture =
          new ImageCapture(track);

      } catch (_) {

        imageCapture = null;

      }

    }


    video.srcObject =
      stream;


    await video.play();


    hideCameraLoading();

  } catch (error) {

    console.error(
      'Camera error:',
      error
    );

    showCameraError();

  }
}


retryCamera.addEventListener(
  'click',
  startCamera
);


/* ==========================================================
   TORCH
========================================================== */

async function setTorch(enabled) {

  if (!stream)
    return false;

  const track =
    stream.getVideoTracks()[0];

  if (
    !track ||
    !track.applyConstraints
  ) {

    return false;

  }

  try {

    await track.applyConstraints({

      advanced: [
        {
          torch: Boolean(enabled)
        }
      ]

    });

    return true;

  } catch (_) {

    return false;

  }
}


/* ==========================================================
   VK FLASH
========================================================== */

async function vkFlash(enabled) {

  try {

    if (
      bridge.supports(
        'VKWebAppFlashSetLevel'
      )
    ) {

      await bridge.send(
        'VKWebAppFlashSetLevel',
        {
          level: enabled ? 1 : 0
        }
      );

      return true;

    }

  } catch (_) {}

  return false;
}


/* ==========================================================
   VISUAL FLASH
========================================================== */

function visualFlash() {

  flashOverlay.classList.remove(
    'fire'
  );

  void flashOverlay.offsetWidth;

  flashOverlay.classList.add(
    'fire'
  );
}


/* ==========================================================
   ORIENTATION
========================================================== */

function getCaptureOrientation() {

  let angle = 0;

  if (
    screen.orientation &&
    Number.isFinite(
      screen.orientation.angle
    )
  ) {

    angle =
      screen.orientation.angle;

  } else if (
    Number.isFinite(
      window.orientation
    )
  ) {

    angle =
      window.orientation;

  }

  angle =
    ((angle % 360) + 360) % 360;

  if (angle === 90)
    return 90;

  if (angle === 180)
    return 180;

  if (angle === 270)
    return 270;

  return 0;
}


/* ==========================================================
   NORMALIZE IMAGE
========================================================== */

async function normalizePhoto(
  blob,
  orientation
) {

  const bitmap =
    await createImageBitmap(blob);

  let rotation =
    orientation;

  const imageLandscape =
    bitmap.width >
    bitmap.height;

  const screenLandscape =
    window.innerWidth >
    window.innerHeight;

  /*
   * Если ImageCapture уже вернул
   * изображение с правильной ориентацией,
   * не вращаем его повторно.
   */

  if (
    imageLandscape ===
    screenLandscape
  ) {

    rotation = 0;

  }

  const orientationLandscape =
    orientation === 90 ||
    orientation === 270;

  if (
    imageLandscape !==
    orientationLandscape
  ) {

    rotation = 0;

  }


  const swap =
    rotation === 90 ||
    rotation === 270;


  canvas.width =
    swap
      ? bitmap.height
      : bitmap.width;

  canvas.height =
    swap
      ? bitmap.width
      : bitmap.height;


  const ctx =
    canvas.getContext(
      '2d',
      {
        alpha: false
      }
    );


  ctx.save();


  if (rotation === 90) {

    ctx.translate(
      canvas.width,
      0
    );

    ctx.rotate(
      Math.PI / 2
    );

  }

  else if (rotation === 180) {

    ctx.translate(
      canvas.width,
      canvas.height
    );

    ctx.rotate(
      Math.PI
    );

  }

  else if (rotation === 270) {

    ctx.translate(
      0,
      canvas.height
    );

    ctx.rotate(
      -Math.PI / 2
    );

  }


  ctx.drawImage(
    bitmap,
    0,
    0
  );

  ctx.restore();


  if (bitmap.close) {
    bitmap.close();
  }


  return new Promise(resolve => {

    canvas.toBlob(
      resolve,
      'image/jpeg',
      .94
    );

  });
}


/* ==========================================================
   IMAGE CAPTURE
========================================================== */

async function captureWithImageCapture() {

  if (
    !imageCapture ||
    !imageCapture.takePhoto
  ) {

    return null;

  }


  /*
   * Сначала пробуем реальную вспышку
   * камеры через ImageCapture.
   */

  try {

    const blob =
      await imageCapture.takePhoto({

        fillLightMode:
          'flash'

      });

    if (blob) {
      return blob;
    }

  } catch (error) {

    console.info(
      'Photographic flash unavailable:',
      error
    );

  }


  /*
   * Если WebView не поддерживает
   * fillLightMode — обычный снимок.
   */

  try {

    const blob =
      await imageCapture.takePhoto();

    if (blob) {
      return blob;
    }

  } catch (error) {

    console.error(
      'ImageCapture failed:',
      error
    );

  }


  return null;
}


/* ==========================================================
   VIDEO FALLBACK
========================================================== */

async function captureFromVideo() {

  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    return null;

  }


  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;


  const ctx =
    canvas.getContext(
      '2d',
      {
        alpha: false
      }
    );


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  return new Promise(resolve => {

    canvas.toBlob(
      resolve,
      'image/jpeg',
      .94
    );

  });
}


/* ==========================================================
   TAKE PHOTO
========================================================== */

async function takePhoto() {

  if (
    isTakingPhoto ||
    !stream ||
    !video.videoWidth
  ) {

    return;

  }


  isTakingPhoto = true;

  captureBtn.disabled = true;


  /*
   * Запоминаем ориентацию ДО снимка.
   */

  const orientation =
    getCaptureOrientation();


  try {

    let blob =
      await captureWithImageCapture();


    /*
     * Fallback для WebView,
     * где ImageCapture не работает.
     */

    if (!blob) {

      let torchEnabled =
        await setTorch(true);


      if (!torchEnabled) {

        await vkFlash(true);

      }


      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            180
          )
      );


      visualFlash();


      blob =
        await captureFromVideo();


      await setTorch(false);

      await vkFlash(false);

    } else {

      visualFlash();

    }


    if (!blob) {

      throw new Error(
        'Camera returned no image'
      );

    }


    /*
     * Нормализуем ориентацию.
     */

    const normalized =
      await normalizePhoto(
        blob,
        orientation
      );


    /*
     * Удаляем старый preview URL.
     */

    if (previewUrl) {

      URL.revokeObjectURL(
        previewUrl
      );

    }


    previewUrl =
      URL.createObjectURL(
        normalized
      );


    /*
     * ВАЖНО:
     *
     * Здесь нет transform: rotate().
     * Сам JPEG уже правильной ориентации.
     */

    photo.src =
      previewUrl;

    photo.style.display =
      'block';

    video.style.display =
      'none';


    cameraActions
      .classList
      .add('hidden');

    previewActions
      .classList
      .remove('hidden');


    carouselWrap.style.opacity =
      '.28';

    carouselWrap.style.pointerEvents =
      'none';


    await haptic(
      'impact'
    );

  } catch (error) {

    console.error(
      'Take photo error:',
      error
    );

    await setTorch(false);

    await vkFlash(false);

  } finally {

    isTakingPhoto = false;

    captureBtn.disabled = false;

  }
}


/* ==========================================================
   CLEAR PREVIEW
========================================================== */

function clearPreview() {

  /*
   * Сначала гарантированно скрываем
   * старое изображение.
   */

  photo.style.display =
    'none';


  /*
   * Освобождаем Blob URL.
   */

  if (previewUrl) {

    URL.revokeObjectURL(
      previewUrl
    );

    previewUrl = null;

  }


  photo.removeAttribute(
    'src'
  );


  /*
   * Возвращаем live camera.
   */

  video.style.display =
    'block';


  /*
   * Возвращаем кнопки.
   */

  previewActions
    .classList
    .add('hidden');

  cameraActions
    .classList
    .remove('hidden');


  carouselWrap.style.opacity =
    '1';

  carouselWrap.style.pointerEvents =
    'auto';
}


/* ==========================================================
   RETAKE
========================================================== */

btnRetake.addEventListener(
  'click',
  async () => {

    /*
     * Сначала полностью уничтожаем
     * старое превью.
     */

    clearPreview();


    /*
     * Перезапускаем камеру.
     *
     * Это особенно важно для Android WebView:
     * после ImageCapture некоторые реализации
     * могут оставить track в нестабильном состоянии.
     */

    await startCamera();

  }
);


/* ==========================================================
   CAROUSEL
========================================================== */

function buildCarousel() {

  const fragment =
    document.createDocumentFragment();


  for (
    let i = 1;
    i <= 100;
    i++
  ) {

    const item =
      document.createElement(
        'div'
      );

    item.className =
      'num-item';

    item.dataset.number =
      String(i);

    item.textContent =
      String(i).padStart(
        2,
        '0'
      );

    fragment.appendChild(
      item
    );

  }


  carousel.appendChild(
    fragment
  );


  requestAnimationFrame(() => {

    selectNumber(
      1,
      false
    );

  });
}


function updateBadge() {

  roomBadge.textContent =
    `№ ${String(selectedNumber).padStart(2,'0')}`;

  roomBadge.classList.remove(
    'bump'
  );

  void roomBadge.offsetWidth;

  roomBadge.classList.add(
    'bump'
  );
}


function selectNumber(
  number,
  vibrate = true
) {

  selectedNumber =
    Math.max(
      1,
      Math.min(
        100,
        number
      )
    );


  const item =
    carousel.querySelector(
      `[data-number="${selectedNumber}"]`
    );


  if (!item)
    return;


  carousel
    .querySelectorAll(
      '.num-item.active'
    )
    .forEach(
      element =>
        element.classList.remove(
          'active'
        )
    );


  item.classList.add(
    'active'
  );


  item.scrollIntoView({

    behavior: 'smooth',

    inline: 'center',

    block: 'nearest'

  });


  updateBadge();


  if (vibrate) {

    haptic(
      'selection'
    );

  }
}


function updateNumberFromScroll() {

  const items =
    [
      ...carousel.querySelectorAll(
        '.num-item'
      )
    ];


  const rect =
    carousel.getBoundingClientRect();


  const center =
    rect.left +
    rect.width / 2;


  let closest = null;

  let distance =
    Infinity;


  for (
    const item of items
  ) {

    const itemRect =
      item.getBoundingClientRect();


    const currentDistance =
      Math.abs(
        itemRect.left +
        itemRect.width / 2 -
        center
      );


    if (
      currentDistance <
      distance
    ) {

      distance =
        currentDistance;

      closest =
        item;

    }

  }


  if (!closest)
    return;


  const number =
    Number(
      closest.dataset.number
    );


  if (
    number !==
    selectedNumber
  ) {

    selectedNumber =
      number;


    items.forEach(
      item => {

        item.classList.toggle(
          'active',
          item === closest
        );

      }
    );


    updateBadge();

    haptic(
      'selection'
    );

  }
}


carousel.addEventListener(
  'scroll',
  () => {

    updateNumberFromScroll();


    clearTimeout(
      snapTimer
    );


    snapTimer =
      setTimeout(() => {

        const active =
          carousel.querySelector(
            '.num-item.active'
          );


        if (active) {

          active.scrollIntoView({

            behavior: 'smooth',

            inline: 'center',

            block: 'nearest'

          });

        }

      }, 90);

  },
  {
    passive: true
  }
);


carousel.addEventListener(
  'click',
  event => {

    const item =
      event.target.closest(
        '.num-item'
      );


    if (item) {

      selectNumber(
        Number(
          item.dataset.number
        )
      );

    }

  }
);


/* ==========================================================
   BUTTONS
========================================================== */

captureBtn.addEventListener(
  'click',
  takePhoto
);


btnSend.addEventListener(
  'click',
  async () => {

    /*
     * Пока заглушка.

);


btnEmpty.addEventListener(
  'click',
  async () => {

    await haptic(
      'impact'
    );


    alert(
      `№${String(selectedNumber).padStart(2,'0')} помечен как «Опустошён»`
    );

  }
);


/* ==========================================================
   VISIBILITY
========================================================== */

document.addEventListener(
  'visibilitychange',
  () => {

    if (
      document.hidden
    ) {

      if (stream) {

        stream
          .getTracks()
          .forEach(
            track =>
              track.enabled = false
          );

      }

    } else if (stream) {

      stream
        .getTracks()
        .forEach(
          track =>
            track.enabled = true
        );

    }

  }
);


/* ==========================================================
   CLEANUP
========================================================== */

window.addEventListener(
  'pagehide',
  () => {

    stopCamera();


    if (previewUrl) {

      URL.revokeObjectURL(
        previewUrl
      );

      previewUrl = null;

    }

  }
);


window.addEventListener(
  'beforeunload',
  () => {

    stopCamera();


    if (previewUrl) {

      URL.revokeObjectURL(
        previewUrl
      );

      previewUrl = null;

    }

  }
);


/* ==========================================================
   START
========================================================== */

buildCarousel();

initVK();

startCamera();

</script>
