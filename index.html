<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Терминал</title>
  
  <!-- VK Bridge из официального CDN VK -->
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/index.umd.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    h1 { font-size: 24px; margin-bottom: 12px; color: #3f8ae0; }
    p { font-size: 16px; color: #aaa; margin-bottom: 24px; }
    .btn {
      background: #3f8ae0;
      color: #fff;
      border: none;
      padding: 16px 32px;
      border-radius: 24px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>VK Mini App Подключен!</h1>
  <p id="status">Инициализация VK Bridge...</p>
  <button class="btn" id="btnTest">Тест вибрации</button>

  <script>
    // 1. Быстрый вызов сигналов VK
    function initApp() {
      const statusElem = document.getElementById('status');
      
      if (window.vkBridge) {
        window.vkBridge.send('VKWebAppInit')
          .then(() => {
            statusElem.innerText = 'Успешно! Приложение работает внутри VK.';
            statusElem.style.color = '#4bb34b';
          })
          .catch((err) => {
            statusElem.innerText = 'Ошибка инициализации: ' + JSON.stringify(err);
          });
      } else {
        statusElem.innerText = 'VK Bridge не найден (запущено вне VK)';
      }
    }

    document.getElementById('btnTest').addEventListener('click', () => {
      if (window.vkBridge) {
        window.vkBridge.send('VKWebAppTapticImpactOccurred', { style: 'heavy' });
        alert('Клик сработал!');
      } else {
        alert('Запущено в браузере');
      }
    });

    // Запуск после загрузки DOM
    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
