<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>VK Camera</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{color:#fff}
#app{position:fixed;inset:0;background:#000;overflow:hidden}
#camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:#000}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20}
.flash.go{animation:flash .18s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.top{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 12px) 16px 0;display:flex;justify-content:flex-end;z-index:10}
.status{background:rgba(0,0,0,.45);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:7px 11px;font-size:12px;opacity:.85}
.bottom{position:absolute;left:0;right:0;bottom:0;padding:0 14px calc(env(safe-area-inset-bottom) + 18px);z-index:10}
.carousel-wrap{margin:0 auto 18px;max-width:520px;position:relative}
.carousel{height:62px;display:flex;align-items:center;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 calc(50% - 30px);overscroll-behavior-x:contain}
.carousel::-webkit-scrollbar{display:none}
.num{flex:0 0 60px;width:60px;height:50px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:19px;font-weight:600;color:rgba(255,255,255,.45);transition:transform .16s,color .16s,opacity .16s}
.num.active{font-size:27px;color:#fff;transform:scale(1.08)}
.center-line{position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);background:rgba(255,255,255,.92);border-radius:2px;pointer-events:none;opacity:.9}
.actions{display:flex;align-items:center;justify-content:center;gap:28px}
.action{height:50px;border:0;border-radius:16px;padding:0 20px;color:#fff;background:rgba(20,20,20,.65);backdrop-filter:blur(16px);font-size:15px;font-weight:600;border:1px solid rgba(255,255,255,.15)}
.action:active{transform:scale(.96)}
#capture{width:72px;height:72px;border-radius:50%;padding:0;background:#fff;border:5px solid rgba(255,255,255,.35);box-shadow:0 0 0 2px rgba(0,0,0,.25)}
#capture:active{transform:scale(.92)}
#capture span{display:block;width:56px;height:56px;background:#fff;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.preview-actions{display:none;gap:10px;max-width:420px;margin:auto}
.preview-actions .action{flex:1}
.send{background:#447bff;border-color:#447bff}
.hidden{display:none!important}
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:30;padding:24px}
.start-card{text-align:center;max-width:320px}
.start-card h1{font-size:24px;margin:0 0 10px}
.start-card p{font-size:14px;line-height:1.45;color:#aaa;margin:0 0 22px}
.start-btn{border:0;background:#447bff;color:#fff;font-size:16px;font-weight:650;border-radius:14px;padding:13px 22px}
.error{color:#ff7676!important}
</style>
</head>
<body>
<div id="app">
  <video id="camera" autoplay playsinline muted></video>
  <img id="photo" alt="Снимок">
  <div class="flash" id="flash"></div>

  <div class="top">
    <div class="status" id="status">Инициализация…</div>
  </div>

  <div class="bottom">
    <div class="carousel-wrap" id="carouselWrap">
      <div class="center-line"></div>
      <div class="carousel" id="carousel"></div>
    </div>

    <div class="actions" id="cameraActions">
      <button class="action hidden" id="retakeTop">Переснять</button>
      <button id="capture" aria-label="Сделать фото"><span></span></button>
    </div>

    <div class="preview-actions" id="previewActions">
      <button class="action" id="retake">Переснять</button>
      <button class="action send" id="send">Отправить</button>
    </div>
  </div>

  <div id="start">
    <div class="start-card">
      <h1>Камера</h1>
      <p id="startText">Разреши доступ к камере, чтобы запустить Mini App.</p>
      <button class="start-btn" id="startBtn">Открыть камеру</button>
    </div>
  </div>
</div>

<script type="module">
import bridge from 'https://cdn.jsdelivr.net/npm/@vkontakte/vk-bridge@3.0.2/+esm';

const video = document.getElementById('camera');
const photo = document.getElementById('photo');
const canvas = document.createElement('canvas');
const flash = document.getElementById('flash');
const carousel = document.getElementById('carousel');
const capture = document.getElementById('capture');
const retake = document.getElementById('retake');
const send = document.getElementById('send');
const previewActions = document.getElementById('previewActions');
const cameraActions = document.getElementById('cameraActions');
const status = document.getElementById('status');
const start = document.getElementById('start');
const startBtn = document.getElementById('startBtn');
const startText = document.getElementById('startText');

let stream = null;
let selectedNumber = 1;
let snapTimer = null;
let flashlightAvailable = false;

function setStatus(text){ status.textContent = text; }

async function initVK(){
  try {
    await bridge.send('VKWebAppInit');
    setStatus('VK Mini App');
  } catch(e) {
    // В обычном браузере это нормально: прототип продолжает работать.
    setStatus('Браузерный режим');
  }
}

async function haptic(){
  try {
    if (bridge.supports('VKWebAppTapticSelectionChanged')) {
      await bridge.send('VKWebAppTapticSelectionChanged');
      return;
    }
  } catch(e){}
  if (navigator.vibrate) navigator.vibrate(8);
}

async function getFlashInfo(){
  try {
    if (bridge.supports('VKWebAppFlashGetInfo')) {
      const data = await bridge.send('VKWebAppFlashGetInfo');
      flashlightAvailable = !!data?.is_available;
    }
  } catch(e){ flashlightAvailable = false; }
}

async function flashlight(level){
  if (!flashlightAvailable) return;
  try { await bridge.send('VKWebAppFlashSetLevel', {level}); } catch(e){}
}

function screenFlash(){
  flash.classList.remove('go');
  void flash.offsetWidth;
  flash.classList.add('go');
}

function buildCarousel(){
  const frag = document.createDocumentFragment();
  for(let i=1;i<=100;i++){
    const el=document.createElement('div');
    el.className='num';
    el.dataset.number=i;
    el.textContent=String(i).padStart(2,'0');
    frag.appendChild(el);
  }
  carousel.appendChild(frag);
  requestAnimationFrame(()=>selectNumber(1,false));
}

function selectNumber(n, vibrate=true){
  selectedNumber=Math.max(1,Math.min(100,n));
  const el=carousel.querySelector(`[data-number="${selectedNumber}"]`);
  if(!el) return;
  el.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
  carousel.querySelectorAll('.num.active').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  if(vibrate) haptic();
}

function updateActiveFromScroll(){
  const items=[...carousel.querySelectorAll('.num')];
  const center=carousel.getBoundingClientRect().left+carousel.clientWidth/2;
  let best=null,bestDist=Infinity;
  for(const el of items){
    const r=el.getBoundingClientRect();
    const d=Math.abs((r.left+r.width/2)-center);
    if(d<bestDist){bestDist=d;best=el;}
  }
  if(best){
    const n=Number(best.dataset.number);
    if(n!==selectedNumber){
      selectedNumber=n;
      items.forEach(x=>x.classList.toggle('active',x===best));
      haptic();
    }
  }
}

carousel.addEventListener('scroll',()=>{
  updateActiveFromScroll();
  clearTimeout(snapTimer);
  snapTimer=setTimeout(updateActiveFromScroll,110);
},{passive:true});

carousel.addEventListener('click',e=>{
  const el=e.target.closest('.num');
  if(el) selectNumber(Number(el.dataset.number));
});

async function startCamera(){
  try{
    startBtn.disabled=true;
    startText.textContent='Запрашиваем доступ к камере…';
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},
      audio:false
    });
    video.srcObject=stream;
    await video.play();
    start.classList.add('hidden');
    setStatus(`№${String(selectedNumber).padStart(2,'0')}`);
    await getFlashInfo();
  }catch(e){
    startBtn.disabled=false;
    startText.className='error';
    startText.textContent='Не удалось открыть камеру. Проверь разрешение камеры и открой страницу по HTTPS (GitHub Pages подходит).';
  }
}

async function takePhoto(){
  if(!video.videoWidth) return;
  const w=video.videoWidth, h=video.videoHeight;
  canvas.width=w; canvas.height=h;
  const ctx=canvas.getContext('2d');
  // Включаем физическую вспышку перед кадром, если VK-клиент её поддерживает.
  await flashlight(1);
  screenFlash();
  await haptic();
  ctx.drawImage(video,0,0,w,h);
  // Гасим вспышку сразу после снимка.
  await flashlight(0);
  photo.src=canvas.toDataURL('image/jpeg',0.92);
  photo.style.display='block';
  video.style.display='none';
  carouselWrap.classList.add('hidden');
  cameraActions.classList.add('hidden');
  previewActions.style.display='flex';
  setStatus(`Фото №${String(selectedNumber).padStart(2,'0')}`);
}

function retakePhoto(){
  photo.style.display='none';
  video.style.display='block';
  carouselWrap.classList.remove('hidden');
  cameraActions.classList.remove('hidden');
  previewActions.style.display='none';
  setStatus(`№${String(selectedNumber).padStart(2,'0')}`);
}

capture.addEventListener('click',takePhoto);
retake.addEventListener('click',retakePhoto);
send.addEventListener('click',()=>{
  // Пока отправка не подключена: только тестовый отклик.
  send.textContent='Готово ✓';
  setStatus(`№${String(selectedNumber).padStart(2,'0')} — тест`);
  setTimeout(()=>send.textContent='Отправить',900);
});
startBtn.addEventListener('click',startCamera);

const carouselWrap=document.getElementById('carouselWrap');

buildCarousel();
initVK();
</script>
</body>
</html>
